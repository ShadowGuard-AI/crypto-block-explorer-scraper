<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The laundrette in three bands: the far window deepening slowly in blue hour, the drums turning in the middle band while one machine finishes and its load is lifted into a basket, and a basket carried past in the near band by a figure who leaves and does not return">
<rect width="1200" height="300" fill="#3a4656"/>
<rect x="0" y="0" width="1200" height="96" fill="#2e4057"><animate attributeName="fill" values="#33475f;#232f3f;#232f3f" dur="40s" repeatCount="indefinite"/></rect>
<rect x="880" y="14" width="260" height="68" fill="#1e2a38"/><circle cx="1010" cy="34" r="12" fill="#f2c14e"/><rect x="1007" y="46" width="6" height="34" fill="#23272b"/>
<rect x="0" y="96" width="1200" height="118" fill="#4a4c4e"/>
<g transform="translate(180 155)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/><circle r="44" fill="#2c3644"/><ellipse cx="-14" cy="6" rx="20" ry="13" fill="#d8782c"/><ellipse cx="16" cy="-10" rx="17" ry="11" fill="#e8e2d4"/></g><circle r="44" fill="none" stroke="#f0eee4" stroke-width="6"/></g>
<g transform="translate(330 155)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/><circle r="44" fill="#2c3644"/><ellipse cx="10" cy="12" rx="19" ry="12" fill="#7890a8"/></g><circle r="44" fill="none" stroke="#f0eee4" stroke-width="6"/></g>
<circle cx="480" cy="155" r="44" fill="#232a33"><animate attributeName="fill" values="#2c3644;#2c3644;#232a33" dur="30s" repeatCount="indefinite"/></circle><circle cx="480" cy="155" r="44" fill="none" stroke="#f0eee4" stroke-width="6"/>
<rect x="560" y="176" width="300" height="12" fill="#e8821e"/><rect x="580" y="188" width="14" height="34" fill="#34383c"/><rect x="826" y="188" width="14" height="34" fill="#34383c"/>
<g><animateTransform attributeName="transform" type="translate" values="-160 0; 1360 0" dur="26s" repeatCount="indefinite"/><polygon points="60,268 130,268 122,296 68,296" fill="none" stroke="#d2c8b2" stroke-width="4"/><ellipse cx="95" cy="262" rx="30" ry="10" fill="#e8e2d4"/><circle cx="95" cy="238" r="10" fill="#464a54"/><rect x="86" y="248" width="18" height="22" fill="#464a54"/></g>
